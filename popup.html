<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Video Player</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="popup-container">
        <h2>Advanced Video Player</h2>
        <div class="controls">
            <button id="openPlayer" class="btn primary">Open Video Player</button>
            <button id="openInNewWindow" class="btn secondary">Open in New Window</button>
        </div>
        <div class="recent-files">
            <h3>Recent Files</h3>
            <div id="recentFilesList" class="files-list">
                <p class="no-files">No recent files</p>
            </div>
        </div>
        <div class="settings-link">
            <button id="openSettings" class="btn link">Settings</button>
        </div>
    </div>
    <script src="js/popup.js"></script>
</body>
</html>
