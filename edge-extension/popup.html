<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesture Player</title>
    <link rel="stylesheet" href="styles/player.css" />
  </head>
  <body class="popup-root">
    <div class="popup">
      <h1 class="popup-title">Gesture Video Player</h1>
      <div class="popup-actions">
        <button id="openTabBtn" class="btn primary">Open in Tab</button>
        <button id="openPopupBtn" class="btn">Open Popup Window</button>
      </div>
      <p class="popup-hint">Load local files once the player opens.</p>
    </div>
    <script type="module" src="js/popup.js"></script>
  </body>
</html>
